name: Sync Google Scholar citations

on:
  schedule:
    - cron: "0 18 * * *"   # every day 03:00 KST
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch citations
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/sync_scholar.py
      - name: Commit if changed
        run: |
          git config user.name "scholar-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/citations.json
          git diff --cached --quiet || git commit -m "Update Scholar citations"
          git push
