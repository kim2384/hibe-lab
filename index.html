<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hibe lab | Chung-Ang University</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: sticky top nav + hash-routed single page; each section is one "page" of the current site. Hero uses an HDR false-colour luminance scale as the lab's signature. */
:root{
  --bg:#f6f8f7; --surface:#ffffff; --ink:#14201d; --muted:#5a6a66; --line:#dbe3e0;
  --teal:#0f6b5c; --teal-soft:#e3f0ec; --sun:#e89a1c;
  --fc1:#1b1f6b; --fc2:#2a6fdb; --fc3:#20b39a; --fc4:#c8d63a; --fc5:#f2a11f; --fc6:#d9381e;
  --display:"Roboto","Noto Sans KR",Arial,sans-serif;
  --body:"Roboto","Noto Sans KR",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-bg:rgba(246,248,247,.9);
  --tile:#e1ebe7;
  color-scheme:only light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav-bg)}
a{color:var(--teal)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:560px){.wrap{padding-left:max(15px,env(safe-area-inset-left,0px));padding-right:max(15px,env(safe-area-inset-right,0px))}}





header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--nav-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header{transition:transform .32s ease}
body.nav-hidden header{transform:translateY(calc(-100% - 2px))}
.nav-peek{position:fixed;top:0;left:0;right:0;height:16px;z-index:6;display:none;cursor:pointer}
.nav-peek::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,#0b7162,#349381,#89b6ab)}
.nav-peek span{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#0b7162;color:#fff;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 14px 4px;border-radius:0 0 10px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;gap:6px;align-items:center}
body.nav-hidden .nav-peek{display:block}
@media (prefers-reduced-motion:reduce){header{transition:none}}
header .wrap{display:flex;align-items:center;gap:16px;padding-block:9px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:500;font-size:19px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em}
.brand img{display:block;height:32px;width:auto}
.logo-d{display:none!important}
nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
nav a{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px}
nav a:hover{color:var(--teal)}
nav a[aria-current="page"]{color:var(--teal);font-weight:600}
html{overflow-y:scroll;scrollbar-gutter:stable}
.dd{position:relative}
.dd-btn{font:inherit;font-size:14px;font-weight:500;color:var(--muted);background:none;border:none;padding:6px 10px;border-radius:6px;cursor:pointer}
.dd-btn:hover,.dd.open .dd-btn{color:var(--ink);background:var(--teal-soft)}
.dd.active .dd-btn{color:var(--teal);background:var(--teal-soft)}
.dd-menu{display:none;position:absolute;top:100%;left:0;padding-top:6px;z-index:6;min-width:170px}
.dd-menu::before{content:"";position:absolute;inset:6px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.08);z-index:-1}
.dd-menu a{display:block;padding:9px 14px;margin:4px}
@media (hover:hover){.dd:hover .dd-menu{display:block}}
.dd.open .dd-menu{display:block}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
.lang button{font:inherit;font-size:12.5px;font-weight:500;background:none;border:none;color:var(--muted);padding:4px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--teal);color:var(--bg)}
@media (max-width:560px){header .lang{display:none}header nav.open~.lang{display:flex;order:5;margin:8px 0 4px}
/* 스마트폰: 한/영 토글을 메뉴 칸 안(Join us 오른쪽 빈 칸)에 */
header nav .lang{display:flex;justify-self:start;align-self:center;margin:0 0 0 10px}}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit;font-size:14px}
@media (max-width:820px){
  .menu-btn{display:block}
  .lang{order:2}
  .menu-btn{order:3;margin-left:12px}
  nav{order:4}
  .brand{margin-right:auto}
  nav{display:none;width:100%;margin-left:0}
  nav.open{display:flex}
  nav a{flex:1 1 40%}
  .dd{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center}
  .dd-btn{pointer-events:none}
  .dd-btn span{display:none}
  .dd .dd-menu,.dd:hover .dd-menu{display:flex;position:static;padding:0;min-width:0;flex:1}
  .dd-menu::before{display:none}
  .dd-menu a{margin:0;flex:1}
}
/* 스마트폰 메뉴: 폭이 되면 3열, 아주 좁으면 2열 */
@media (max-width:820px) and (min-width:340px){nav.open{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}nav.open a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}

main{min-height:60vh}
section.page{padding-block:24px 72px}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;line-height:1.2}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin:0 0 8px}
.page-title{font-size:clamp(24px,3.6vw,34px);margin:0 0 28px;font-weight:500;color:var(--h1a);background:linear-gradient(180deg,var(--h1a) 15%,var(--h1b) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;width:fit-content;max-width:100%}
.lead{font-size:18px;max-width:65ch;color:var(--ink)}
p{max-width:68ch}

/* Hero */
.hero{padding-block:12px 4px}
.hero h1{font-size:clamp(22px,3.15vw,35px);font-weight:500;margin:0 0 3px;line-height:1.2;color:var(--h1a);background:linear-gradient(180deg,var(--h1a) 0%,var(--h1b) 55%,var(--h1c) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
:root{--h1a:#0b7162;--h1b:#349381;--h1c:#89b6ab;--card-gray:#949495}
.hero h1 .nw{white-space:nowrap}
.hero h1:last-child{margin-bottom:6px}
/* 영문 타이틀: 20% 작게, 두 줄 간격 촘촘히 */
.hero h1.t-en{font-size:clamp(18px,2.52vw,28px);line-height:1.1}
/* 한영 전환해도 아래 그리드 위치가 그대로이도록: 두 제목을 같은 칸에 겹쳐 두고 하나만 보이게 */
.hero-t{display:grid}.hero-t>h1{grid-area:1/1;margin-bottom:6px}html[lang=en] .hero-t .t-ko,html[lang=ko] .hero-t .t-en{visibility:hidden}
@media (max-width:560px){.hero h1,.hero .ko{white-space:nowrap;overflow:hidden;max-width:100%}.hero h1.t-en{font-size:4vw}}
.hero .ko{font-size:clamp(13px,1.9vw,16px);color:var(--card-gray);margin:0 0 12px;font-weight:500;line-height:1.3}
.hero .tag{font-family:var(--display);font-weight:700;font-size:20px;color:var(--teal);margin:0 0 8px}
.lumscale{margin-top:36px;max-width:720px}
.lumscale .bar{height:14px;border-radius:3px;background:linear-gradient(90deg,var(--fc1),var(--fc2),var(--fc3),var(--fc4),var(--fc5),var(--fc6))}
.lumscale .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.lumscale .cap{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}

.two{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;padding-block:48px}
.two > *{min-width:0}
@media (max-width:820px){.two{grid-template-columns:1fr;gap:28px}}
.intro{padding-block:28px 72px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:48px;align-items:start}
.intro > *{min-width:0}
@media (max-width:820px){.intro{grid-template-columns:1fr;gap:32px}}
.areas-side .areas-title{font-size:17px;margin:4px 0 12px}
.vmarquee{height:430px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent)}
.vq-track{display:flex;flex-direction:column;gap:12px;animation:vq 40s linear infinite}
.vmarquee:hover .vq-track{animation-play-state:paused}
@keyframes vq{from{transform:translateY(0)}to{transform:translateY(calc(-50% - 6px))}}
.areas-side .area-card{width:auto;padding:16px 18px;gap:6px;border-radius:10px}
.areas-side .area-card b{font-size:15px}
.areas-side .area-card span{font-size:13.5px;line-height:1.55}
@media (prefers-reduced-motion:reduce){.vq-track{animation:none}.vmarquee{overflow-y:auto}}
.areas-title{font-size:22px;margin:24px 0 20px}
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mq-track{display:flex;gap:20px;width:max-content;animation:mq 45s linear infinite;padding-block:4px}
.marquee:hover .mq-track{animation-play-state:paused}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 10px))}}
.area-card{width:min(340px,78vw);flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:10px;align-content:start}
.area-card b{font-size:18px;font-weight:500;color:var(--teal)}
.area-card span{font-size:15px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:reduce){.mq-track{animation:none}.marquee{overflow-x:auto}}
.areas{list-style:none;padding:0;margin:0;display:grid;gap:0;border-top:1px solid var(--line)}
.areas li{padding:18px 0;border-bottom:1px solid var(--line)}
.areas b{display:block;font-family:var(--display);font-size:17px}
.areas span{color:var(--muted);font-size:15px}
.funders{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--surface)}

/* PI */
.pi-head{display:grid;grid-template-columns:160px 1fr;gap:32px;align-items:start;margin-bottom:40px}
.pi-head > *{min-width:0}
@media (max-width:640px){.pi-head{grid-template-columns:1fr;gap:20px;margin-bottom:28px}.pi-head .photo{width:min(200px,55vw);justify-self:center}}
@media (max-width:560px){.pi-head .photo{width:min(120px,calc((50vw - 53px)*.8));aspect-ratio:5/6}}
.photo{aspect-ratio:4/5;max-width:100%;border-radius:8px;background:repeating-linear-gradient(135deg,var(--teal-soft) 0 10px,transparent 10px 20px),var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-weight:800;font-size:34px;position:relative}
.photo.has{background:none;overflow:hidden;border:0}.photo.has::after{display:none}.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo::after{content:"사진 이전 예정";position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:var(--body);font-weight:500;font-size:11px}
.pi-name{font-size:30px;margin:0}
.pi-role{color:var(--muted);margin:4px 0 14px}
.contact{display:flex;gap:10px;flex-wrap:wrap;font-size:14px}
.contact a,.contact span{text-decoration:none}.contact{gap:20px!important}.contact a:hover{text-decoration:underline}
.cv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:32px 48px}
@media (max-width:980px){.cv-grid{grid-template-columns:1fr}}
.cv-grid h3{font-size:18px;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--teal)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tl li{display:grid;grid-template-columns:52px 1fr;gap:10px}
.tl .y{font-family:var(--mono);color:var(--teal);font-size:14px;font-variant-numeric:tabular-nums}
.plain{margin:0;padding-left:18px;display:grid;gap:4px}
.course{display:grid;grid-template-columns:56px 1fr;gap:10px}
.course code{font-family:var(--mono);font-size:13px;color:var(--muted)}

.edu-tl li{grid-template-columns:52px 1fr 84px;align-items:center;gap:14px}
.edu-tl li > *{min-width:0}.edu-tx{display:flex;flex-direction:column;line-height:1.35;word-break:keep-all}.edu-sp{display:contents}
html[lang=ko] .edu-sp{display:block}html[lang=ko] .edu-sp>span+span::before{content:", "}
.edu-logo{width:84px;height:75px;display:flex;align-items:center;justify-content:center}
.edu-logo img{width:75px;height:75px;object-fit:contain;display:block}
.edu-logo img[alt="Yonsei University"]{width:69px;height:69px}
.edu-logo .ph{width:100%;height:100%;border:1px dashed var(--line);border-radius:6px;display:grid;place-content:center;text-align:center;font-size:10.5px;line-height:1.2;color:var(--muted);padding:0 4px}
@media (max-width:480px){.edu-tl li{grid-template-columns:34px 1fr 45px;gap:6px}.edu-tl .y{font-size:12.5px}html[lang=en] .edu-tx{font-size:12px;letter-spacing:-.01em}.edu-tl .edu-logo{width:45px;height:45px}.edu-logo img{width:45px;height:45px}.edu-logo img[alt="Yonsei University"]{width:41px;height:41px}.edu-logo .ph{font-size:8px}}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-12px 0 40px}
.tabs a{text-align:center;padding:12px 22px;font-size:17px;font-weight:500;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink);background:var(--teal-soft)}
.tabs a[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}

/* Members */
.group-title{font-size:22px;font-weight:500;margin:48px 0 20px;display:flex;align-items:baseline;gap:10px}
.group-title .n{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:400}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}
.member{background:var(--surface);border:0;box-shadow:0 1px 6px rgba(0,0,0,.07);border-radius:12px;padding:16px 16px 18px;display:grid;gap:4px;justify-items:center;text-align:center;transition:box-shadow .15s}

.member .avatar{width:100%;max-width:150px;height:auto;aspect-ratio:5/6;font-size:28px;margin-bottom:10px}
.member .role{margin:0}
.member{display:flex;flex-direction:column;align-items:center}
.members .member .role{margin:2px 0 0}
.member ul.m-ints{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;line-height:1.4;color:var(--muted);display:grid;gap:3px}.member ul.m-ints li{margin:0;padding:0}
.member .m-links{margin-top:auto;padding-top:14px}
.m-links{display:flex;gap:8px;justify-content:center;margin-top:12px;font-size:12.5px}.m-links a{display:inline-flex;align-items:center;gap:5px;color:var(--teal);font-weight:500;text-decoration:none;padding:4px 10px;border-radius:999px;background:var(--teal-soft);transition:background .15s,color .15s}.m-links a:hover{background:var(--teal);color:#fff}
.role .r1,.role .r2{display:inline-block;white-space:nowrap}.role .r2{font-size:.86em;opacity:.75;margin-left:6px;white-space:nowrap}
.m-detail{display:grid;grid-template-columns:140px 1fr;gap:24px;align-items:start}
.m-detail .avatar{width:140px;height:168px}
.m-detail h3{margin:0}
.m-detail .role{font-size:14px;color:var(--muted);margin:2px 0 16px}
.m-detail .ri{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.m-detail ul{margin:0 0 18px;padding-left:18px;font-size:15px;line-height:1.6}
.m-detail .links{font-size:14px;display:flex;gap:16px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:520px){.m-detail{grid-template-columns:1fr}.m-detail .avatar{width:120px;height:144px}}
.member > *{min-width:0}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar:has(img){background:none;border-radius:0}
.avatar{width:96px;height:120px;border-radius:8px;overflow:hidden;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px}
@media (max-width:480px){.members{grid-template-columns:repeat(2,1fr);gap:12px}.member{padding:12px}}
@media (max-width:560px){.member .avatar{width:80%;max-width:120px}}
.member h4{margin:0;font-family:var(--display);font-size:17px;font-weight:500}
.member .role{font-size:14px;color:var(--muted);margin:2px 0 16px}
.member .ri{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.member ul{margin:0 0 18px;padding-left:18px;font-size:15px;line-height:1.6;display:grid;gap:2px}
.member .links{font-size:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding-top:14px;border-top:1px solid var(--line)}

/* Projects carousel */
.track{position:relative;display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px calc((100% - min(100%,760px))/2) 8px;scrollbar-width:none}
.car-wrap{position:relative;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)}
.car-arrow{position:absolute;top:34%;z-index:2;width:46px;height:46px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:26px;font-weight:600;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(11,113,98,.35);transition:opacity .2s,background .2s}.car-arrow:hover{background:#349381}
.car-arrow.l{left:calc(50% - min(50%,380px) + 10px)}.car-arrow.r{right:calc(50% - min(50%,380px) + 10px)}
.car-arrow:disabled{opacity:0;pointer-events:none}
.slide{opacity:.45;transform:scale(.96);transition:opacity .3s,transform .3s}.slide.on{opacity:1;transform:none}
.car-nav{justify-content:center}.car-hint{font-size:12px;color:var(--muted);margin-left:8px}
.proj-tabbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;border-bottom:1px solid var(--line);margin:-8px 0 24px}.proj-tabbar .tabs{border-bottom:0;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.yr-pick select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 36px 8px 16px;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}.proj-tabs{margin:0 0 28px}.tabs button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:12px 22px;font-size:16px;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button:hover{color:var(--ink);background:var(--teal-soft)}.tabs button[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}
.role-tag{font-style:normal;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;margin-right:8px;border:1px solid var(--teal);color:var(--teal);vertical-align:1px}

.lead{font-size:15.5px}.hero .tag{font-size:16px}
.about-page .ab-h,.ab-h{font-size:17px;margin:22px 0 10px}
.areas-title,.group-title{font-size:18px}.area-card b{font-size:15px}.area-card span,.areas span{font-size:13.5px}
.pi-name{font-size:23px}.cv-grid h3,.pub-group h3{font-size:16px}.pi-cites b{font-size:16px}
.member h4{font-size:15px}.member ul,.m-detail ul{font-size:13.5px}
.join-card h3{font-size:16px}.join-card ul{font-size:14px}.apply h3{font-size:18px}.apply .mail{font-size:14px}
.tabs a{font-size:15px}.tabs button{font-size:14.5px}
.ps b,.proj-head .ps b{font-size:20px}

.modal-body .pdesc,.modal-body .ptext,.modal-body .sum{font-size:14px}
.post h3{font-size:14.5px}.pub .a,.pub .v,.pub .ct{font-size:13px}

/* 스마트폰: 수상·활동 그리드를 홈 피드와 같은 규격으로 (3열, 2px 간격, 좌우 4px, 직각 정사각형) — 색·스타일은 원래대로 */
@media (max-width:560px){
.ig,.feed{grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-inline:-11px}
.ig-tile{border-radius:0}
.post{aspect-ratio:1/1;border-radius:0;min-height:0}
.post .ph{aspect-ratio:auto;flex:1 1 auto;min-height:0}
.post .ph .cnt{right:4px;top:4px;font-size:9px;padding:1px 5px}
.post .body{flex:0 0 auto;min-height:0;padding:4px 6px 5px;gap:1px;display:block}
.post .meta{display:block;font-size:7.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post h3{font-size:10.5px;line-height:1.3}
.post p,.post .sample,.post .del{display:none}
}

  /* 과제 정보: projects 순서와 같음 (기존 사이트 Projects 페이지에서 옮김) */
  projectInfo: [{"period": "2026.07 – 2035.02", "funder": "Seoul Metropolitan Government", "amount": "KRW 120 Million", "no": "", "desc": "Seoul ANCHOR 10 Challenge builds an AI-based Net-Zero platform for a carbon-neutral Seoul. Its five sub-projects (buildings, transportation, carbon capture, waste, and the carbon market) are designed not as separate studies but as input modules of one integrated optimization platform. Each produces sector emissions and technology performance and cost parameters (energy efficiency, carbon reduction, CAPEX/OPEX) in a common data format. These feed a superstructure optimization model that derives Seoul's least-cost Net-Zero pathway, and the results flow back to S-Map visualization and carbon-market decisions.\nOur lab leads the building sector (BIPV and green buildings), the largest emitter at 68.8% of Seoul's greenhouse gas emissions:\n• An integrated Seoul building and climate dataset from S-Map, V-World and KMA data, with a generative AI urban augmentation model to fill data gaps\n• A GPU-accelerated physics-informed neural network (PINN) surrogate for city-scale solar irradiance prediction\n• PV generation, energy self-sufficiency and CO₂ reduction forecasts linked to public-building PV data\n• A Seoul BIPV deployment roadmap, policy guidelines and an S-Map-linked GIS visualization API, with the Seoul Metropolitan Government, SH and Seoul Energy Corporation", "role": "Co-PI", "amountNote": "Direct costs secured by hibe lab: KRW 60 Million each for 2026 and 2027 (through 2028.02)", "amountNoteKo": "hibe lab 확보 직접비: 2026년·2027년 각 6천만 원 (2028.02까지)", "total": "KRW 8,000 Million", "descKo": "서울 앵커10 챌린지는 탄소중립 서울을 위한 AI 기반 Net-Zero 플랫폼을 구축합니다. 다섯 개 세부과제(건물, 수송, 탄소포집, 폐기물, 탄소시장)는 따로 떨어진 연구가 아니라 하나의 통합 최적화 플랫폼에 들어가는 입력 모듈로 설계됩니다. 각 세부과제는 부문별 배출량과 기술 성능·비용 변수(에너지 효율, 탄소 감축, CAPEX/OPEX)를 공통 데이터 형식으로 산출합니다. 이 값들이 슈퍼스트럭처 최적화 모델에 들어가 서울의 최소비용 Net-Zero 경로를 도출하고, 그 결과는 다시 S-Map 시각화와 탄소시장 의사결정으로 이어집니다.\n우리 연구실은 서울 온실가스 배출의 68.8%를 차지하는 최대 배출원인 건물 부문(BIPV·그린빌딩)을 맡습니다.\n• S-Map, V-World, 기상청 데이터로 서울 건물·기후 통합 데이터셋을 구축하고, 생성형 AI 도시 증강 모델로 빈 데이터를 보완\n• 도시 규모 일사량 예측을 위한 GPU 가속 물리정보 신경망(PINN) 대리모델 개발\n• 공공건물 태양광 데이터와 연계한 발전량·에너지 자립률·CO₂ 감축량 예측\n• 서울시, SH, 서울에너지공사와 함께 서울시 BIPV 보급 로드맵·정책 가이드라인과 S-Map 연계 GIS 시각화 API 마련"}, {"period": "2026.05 – 2028.12", "funder": "Ministry of Land, Infrastructure and Transport", "amount": "KRW 500 Million", "no": "", "desc": "The Green Remodeling Talent Development Platform at Chung-Ang University cultivates practice- and research-oriented professionals capable of performing the full lifecycle of Green Remodeling (GR)—diagnosis, planning, design, construction, operation, and performance evaluation—in response to the growing demand for carbon-neutral building expertise. Built on an integrated architecture and architectural engineering curriculum, the program combines specialized coursework (24+ credits) with extracurricular activities (15+ credits), and operates a three-tier \"Carbon-Neutral Architecture·GR Micro-degree\" system (Green–Silver–Gold) supported by blockchain-based digital badges. Leveraging the GR Metropolitan Hub Platform and industry-academia networks, it strengthens field internships and employment linkages, aiming to produce 24+ specialized program completers annually over 2026–2028 and establish a sustainable educational framework beyond the project's conclusion.", "role": "PI", "descKo": "중앙대학교 그린리모델링 인재양성 플랫폼은 탄소중립 건축 전문인력 수요 증가에 맞춰, 그린리모델링(GR)의 전 주기(진단, 기획, 설계, 시공, 운영, 성능 평가)를 수행할 수 있는 실무·연구형 전문인력을 양성합니다. 건축학과 건축공학을 아우르는 통합 교육과정을 바탕으로 전공 교과(24학점 이상)와 비교과 활동(15학점 이상)을 결합하고, 블록체인 기반 디지털 배지로 뒷받침되는 3단계 '탄소중립건축·GR 마이크로디그리'(그린–실버–골드) 제도를 운영합니다. GR 수도권 거점 플랫폼과 산학 네트워크를 활용해 현장 실습과 취업 연계를 강화하며, 2026–2028년 동안 매년 24명 이상의 전문과정 이수자를 배출하고 사업 종료 후에도 지속 가능한 교육 체계를 갖추는 것을 목표로 합니다."}, {"period": "2026.03 – 2031.02", "funder": "National Research Foundation of Korea", "amount": "KRW 705.50 Million", "no": "2710106861", "desc": "This project is a research initiative designed to develop a holistic analytical framework for urban light pollution. The project addresses two critical challenges: nighttime light pollution from sources such as media facades and daytime glare caused by high-reflectivity building materials. Moving beyond conventional quantity-based lighting regulations, this initiative introduces Human-Centric Lighting (HCL) indicators to prioritize human health and well-being, with a focus on the visual and non-visual impacts of light. To achieve this, the project develops an integrated methodological framework that includes public-data-driven 3D city modeling, GPU-accelerated dynamic light simulations, and a real-time monitoring system based on HDRI and computer vision. Ultimately, this project aims to provide standardized design guidelines and a scientific evaluation protocol that mitigate social conflict and legal disputes while fostering a safer, healthier, and more sustainable urban lightscape.", "role": "PI", "amountNote": "KRW 141.1 Million per year for 5 years", "amountNoteKo": "연 1억 4,110만 원 × 5년", "descKo": "이 과제는 도시 빛공해를 종합적으로 분석하는 틀을 개발하는 연구입니다. 미디어파사드 등에서 나오는 야간 빛공해와 고반사 건축 자재로 인한 주간 눈부심이라는 두 가지 핵심 문제를 다룹니다. 기존의 조도 중심 조명 규제를 넘어 인간중심조명(HCL) 지표를 도입해, 빛의 시각적·비시각적 영향을 중심으로 사람의 건강과 웰빙을 우선합니다. 이를 위해 공공데이터 기반 3D 도시 모델링, GPU 가속 동적 빛 시뮬레이션, HDRI와 컴퓨터 비전 기반 실시간 모니터링 시스템을 포함한 통합 방법론을 개발합니다. 최종적으로 사회적 갈등과 법적 분쟁을 줄이고 더 안전하고 건강하며 지속 가능한 도시 빛환경을 만들기 위한 표준 설계 가이드라인과 과학적 평가 프로토콜을 제시하는 것을 목표로 합니다."}, {"period": "2026.03 – 2030.02", "funder": "National Research Foundation of Korea", "amount": "KRW 80 Million", "no": "2710101182", "desc": "", "role": "Co-PI", "amountNote": "KRW 20 Million per year allocated to hibe lab", "amountNoteKo": "hibe lab 배정 연 2천만 원", "total": "KRW 2,302.00 Million"}, {"period": "2025.09 – 2026.08", "funder": "National Research Foundation of Korea", "amount": "KRW 92.84 Million", "no": "2710090289", "desc": "The ultimate objective of this project is to develop a model that supports the design and operation of net-zero energy buildings at the community scale, thereby enabling informed decision-making regarding the urban applicability of photovoltaic systems. The specific objectives are as follows: (1) to preprocess and database public GIS data and construct foundational datasets for urban-scale machine learning and simulation; (2) use generative AI technics to massively augment realistic 3D urban models; and (3) to develop a physics-informed neural network (PINN) surrogate model that embeds radiative transfer constraints into the loss function, enabling fast prediction of urban-scale solar irradiance and photovoltaic potential, and to experimentally validate the proposed approach.", "role": "PI", "descKo": "이 과제의 최종 목표는 커뮤니티 규모의 제로에너지건물 설계·운영을 지원하는 모델을 개발해, 도시에 태양광 시스템을 적용할 수 있는지 판단하는 의사결정을 돕는 것입니다. 세부 목표는 다음과 같습니다. (1) 공공 GIS 데이터를 전처리·데이터베이스화하여 도시 규모 머신러닝과 시뮬레이션을 위한 기초 데이터셋을 구축하고, (2) 생성형 AI 기법으로 실제와 같은 3D 도시 모델을 대량 증강하며, (3) 복사 전달 제약을 손실 함수에 넣은 물리정보 신경망(PINN) 대리모델을 개발해 도시 규모 일사량과 태양광 잠재량을 빠르게 예측하고, 제안한 방법을 실험으로 검증합니다."}, {"period": "2024.07 – 2025.03", "funder": "Korea Agency for Infrastructure Technology Advancement", "amount": "KRW 44.20 Million", "no": "2610000200", "desc": "A cross-nation (Korea-United Kingdom) consortium-based research project aiming to develop a software suite to design and operate net-zero energy buildings at a community scale.\nOur group's objectives are to: i) develop a computationally efficient simulation method to estimate the solar harvesting potential of photovoltaic panels either attached or integrated into the buildings, at a community or urban scale; ii) experimentally validate the simulation method developed, based on public datasets; and iii) develop a time-resolved design optimization algorithm for BAPV and BIPV design at a community scale, that maximizes the energy autonomy of the communities.", "role": "Co-PI", "amountNote": "Allocated to hibe lab (KRW 44,204,800)", "amountNoteKo": "hibe lab 배정액 (44,204,800원)", "total": "KRW 212.62 Million", "descKo": "한국–영국 국제 컨소시엄 공동연구로, 커뮤니티 규모의 제로에너지건물을 설계·운영하기 위한 소프트웨어 제품군을 개발합니다.\n우리 연구실의 목표는 다음과 같습니다. i) 건물에 부착하거나 일체화한 태양광 패널의 일사 수확 잠재량을 커뮤니티·도시 규모에서 추정하는 계산 효율적인 시뮬레이션 방법 개발, ii) 개발한 시뮬레이션 방법을 공공 데이터셋으로 실험 검증, iii) 커뮤니티의 에너지 자립도를 최대화하는 커뮤니티 규모 BAPV·BIPV 시간분해 설계 최적화 알고리즘 개발."}],

    ["sci",2018,"Konstantzos, I., Kim, M. & Tzempelikos, A.","An Integrated Method and Web Tool to Assess Visual Environment in Spaces with Window Shades","Science and Technology for the Built Environment, 24(5), 470–482.","10.1080/23744731.2018.1438021"],
    ["kci",2025,"Yoon, D., Cho, H., Jang, H., Kang, Y., & Kim, M.","Sensitivity Analysis of Albedo Assumptions in Urban-Scale Solar Irradiance Simulations","The International Journal of The Korea Institute of Ecological Architecture and Environment, 25(2), 5-13.","10.12813/kieae.2025.25.2.005","","Kim, M."],
    ["intconf", 2026, "Cho, H., Jang, H., & Kim, M.", "A Physics-Structured Surrogate Model for Hourly Solar Irradiance on Urban Building Surfaces", "Presented at ASim 2026 (IBPSA Asia Conference), November 2026.", "", "A physics-structured surrogate multiplies analytical beam and diffuse irradiance terms by a neural correction factor to predict hourly irradiance on 351,685 roof and façade sensors in a Seoul district. It reached an annual cumulative R² of 0.97 on unseen buildings, halved training time, and its learned correction factor exposed a missing tilt-dependent diffuse term.", "", "2026-11-26", ""],
    ["intconf", 2026, "Yoon, D., Kang, K., & Kim, M.", "Fisheye Image Conditions for Equivalent Albedo Approximation in Urban Facade Irradiance Simulation", "Presented at ASim 2026 (IBPSA Asia Conference), November 2026.", "", "An image-derived weighted-mean albedo from orthographic fisheye maps is tested as a stand-in for sensor-specific equivalent albedo on 8,473 façade sensors. It cut annual RMSE from 87.9 to about 28–32 kWh/m²·yr versus the uniform 0.20 assumption, with field of view mattering more than resolution.", "", "2026-11-26", ""],
    ["intconf", 2026, "Kang, Y., Kang, K., & Kim, M.", "Eye-Level Vertical Illuminance as an Indicator for Integrated Assessment of Glare and Circadian Lighting in Sidelit Open-Plan Offices", "Presented at ASim 2026 (IBPSA Asia Conference), November 2026.", "", "Annual RADIANCE and Lark simulations of a sidelit open-plan office show that meeting both glare (DGP ≤ 0.35) and circadian (CS ≥ 0.3) criteria corresponds to a two-sided band of eye-level vertical illuminance. The upper bound stays near 3,240 lux, while the lower bound rises with warmer wall spectra, making Ev a location-based diagnostic for layout and lighting decisions.", "", "2026-11-26", ""],
    ["intconf", 2026, "Kang, K., Kang, Y., Yoon, D., & Kim, M.", "Systematic Quantification of Occupant Visual Field Errors in Image-Based Daylight Simulation", "Presented at ASim 2026 (IBPSA Asia Conference), November 2026.", "", "Image-based lighting from a single façade HDRI is compared with explicit geometry over an 816-point grid and 50 sky conditions in a perimeter office. Agreement is high overall (CCC = 0.997), but errors concentrate sharply where the occupant's line of sight to the sun grazes the window frame, not with distance from the capture point.", "", "2026-11-26", ""],
    ["intconf", 2026, "Jang, H., Cho, H., & Kim, M.", "A Generative Augmentation Framework for 3D Urban Digital Twins Leveraging Conditional Diffusion Model", "Presented at ASim 2026 (IBPSA Asia Conference), November 2026.", "", "Public GIS data are preprocessed into tensors and a conditional diffusion model, conditioned on patch-level morphological indicators, generates realistic and controllable urban layouts that are extruded into 3D models. The framework supplies augmented urban geometry for training deep-learning surrogate models of urban environmental performance.", "", "2026-11-26", ""],

/* 지원서 양식: Turnstile(스팸 방지) 확인 후 Worker /apply 로 보내면 교수님 메일로 감 */
function introLen(v){v=v.trim();return /[가-힣]/.test(v)?{n:v.length,max:500,u:T(" chars","자")}:{n:v?v.split(/\s+/).length:0,max:100,u:T(" words","단어")};}
function applyInit(){const f=document.getElementById("applyForm");if(!f)return;let token="";
  const msg=(t,ok)=>{const m=f.querySelector("#afMsg");m.textContent=t;m.classList.toggle("ok",!!ok);},cnt=()=>{const L=introLen(f.elements.intro.value);const c=f.querySelector("#afCnt");c.textContent=`${L.n} / ${L.max}${L.u}`;c.classList.toggle("over",L.n>L.max);return L;};
  f.elements.intro.addEventListener("input",cnt);cnt();
  const draw=()=>{try{window.turnstile.render(f.querySelector("#tsBox"),{sitekey:APPLY_SITEKEY,language:LANG==="ko"?"ko":"en",callback:t=>{token=t;},"expired-callback":()=>{token="";}});}catch(e){}};
  if(window.turnstile)draw();else{window.onTsLoad=()=>{const g=document.getElementById("applyForm");if(g===f)draw();else applyInit();};
    if(!document.getElementById("tsJs")){const sc=document.createElement("script");sc.id="tsJs";sc.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTsLoad";sc.async=true;document.head.appendChild(sc);}}
  f.onsubmit=async e=>{e.preventDefault();const E=f.elements,file=E.pdf.files[0],L=cnt();
    if(!E.name.value.trim()||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(E.email.value.trim())||!E.intro.value.trim()||!file)return msg(T("Please fill in all required fields (*).","* 표시한 항목을 모두 입력해 주세요."));
    if(L.n>L.max)return msg(T(`Please keep the introduction within ${L.max}${L.u}.`,`자기소개는 ${L.max}${L.u} 이내로 줄여 주세요.`));
    if(!(file.type==="application/pdf"||/\.pdf$/i.test(file.name))||file.size>10e6)return msg(T("Please attach a PDF under 10 MB.","10MB 이하 PDF 파일을 첨부해 주세요."));
    if(!token)return msg(T("Please complete the spam check above the button.","버튼 위의 스팸 방지 확인을 마쳐 주세요."));
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;msg(T("Sending…","보내는 중…"));
    try{const pdf=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=no;fr.readAsDataURL(file);});
      const r=await fetch(`${GH_AUTH}/apply`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:E.name.value,email:E.email.value,aff:E.aff.value,program:E.program.value,intro:E.intro.value,pdf,pdfName:file.name,token,lang:LANG==="ko"?"ko":"en"})});

    ${touch?`<div class="pdf-pages"><p class="pdf-wait">${T("Loading…","불러오는 중…")}</p></div>`:`<iframe src="${esc(src)}#view=FitH" title="PDF" allow="fullscreen"></iframe>`}</div>`);
  $modal.querySelector(".modal-box").classList.add("max","cv-box");document.getElementById("mMax").textContent="⤡";
  if(touch){const box=$mc.querySelector(".pdf-pages");(async()=>{try{const lib=await pdfLib(),doc=await lib.getDocument(src).promise;box.innerHTML="";
      for(let n=1;n<=doc.numPages;n++){if(!box.isConnected)return;const pg=await doc.getPage(n),w=box.clientWidth||innerWidth,v0=pg.getViewport({scale:1}),sc=w*Math.min(2,devicePixelRatio||1)/v0.width,vp=pg.getViewport({scale:sc});
        const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);box.appendChild(c);await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;}}
    catch(e){box.innerHTML=`<p class="pdf-wait">${T("Could not show the PDF here. Use Download.","여기서 PDF를 보여 주지 못했습니다. 내려받기를 눌러 주세요.")}</p>`;}})();}}
function openPub(k){const [cat,y,a,t,v,doi,sum,corr,,,pdf]=SITE.pubs[k],cover=pubCover(SITE.pubs[k]);const label=SITE.pubCats.find(c=>c[0]===cat)[1];
  openModal(`<div class="modal-body"><h3 id="mTitle">${esc(t)}</h3><div class="cite">${authors(a,corr)}<br>${esc(v)}</div>
  <div class="pub-mb${cover?" has-cover":""}">${cover?`<img class="pub-cover" src="${cover}" alt="" role="button" tabindex="0" title="${T("Enlarge","크게 보기")}" onclick="openLightbox([this.src],0)" onkeydown="if(event.key==='Enter')openLightbox([this.src],0)" onerror="this.parentNode.classList.remove('has-cover');this.remove()">`:""}<div class="sum">${sum?esc(sum):todo()}</div></div>
  ${citeOf(doi,t)?`<div class="cite-note">${T(`Cited by ${citeOf(doi,t)} (${CITES_SRC}, ${CITES_DATE})`,`인용 ${citeOf(doi,t)}회 (${CITES_SRC==="OpenAlex"?"OpenAlex":"구글 스칼라"}, ${CITES_DATE} 기준)`)}</div>`:""}
  <div class="pub-links">${pdf?`<button type="button" class="btn-post pub-pdf" data-pdf="${esc(pdf)}">${T("View PDF","PDF 보기")}</button>`:""}${doi?`<a href="https://doi.org/${doi}" target="_blank" rel="noopener">${T("Read the paper","원문 보기")} (doi:${doi})</a>`:""}</div></div>`);
  $mc.querySelector(".pub-pdf")?.addEventListener("click",()=>openPdf(pdf,t));}

/* 과제 개요: 입력한 항목만 보여 줌 (국문 칸이 비면 영문, 영문이 비면 국문) */
const bi=(en,ko)=>LANG==="ko"?(ko||en||""):(en||ko||"");
function projOverview(f){const row=(l,v,c="")=>v?`<dt>${l}</dt><dd${c}>${v}</dd>`:"";
  const money=(f.total&&f.total!==f.amount?`<div class="amt">${T("Total project","과제 전체")} <b>${esc(krw(f.total))}</b>${usd(f.total)}</div>`:"")+(f.amount?`<div class="amt">${f.total&&f.total!==f.amount?T("hibe lab portion","hibe lab 배정"):T("Amount","연구비")} <b>${esc(krw(f.amount))}</b>${usd(f.amount)}</div>`:"")+(f.annual?`<small class="amt-note">${T(`${f.annual} per year`,`연 ${krw(f.annual)}`)}</small>`:"")+(f.amountNote||f.amountNoteKo?`<small class="amt-note">${esc(bi(f.amountNote,f.amountNoteKo))}</small>`:"");
  const d=bi(f.desc,f.descKo);
  return `<dl>${row(T("Program","사업명"),esc(bi(f.program,f.programKo)))}${row(T("Project title","연구과제명"),esc(bi(f.task,f.taskKo)))}${row(T("Ministry","주무부처"),esc(bi(f.ministry,f.ministryKo)))}${row(T("Funded by","지원 기관"),esc(pFunder(f)))}${row(T("Funding","연구비"),money)}${row(T("Role","역할"),f.role==="PI"?T("Principal Investigator (PI)","연구책임자 (PI)"):f.role?T("Co-Principal Investigator (Co-PI)","공동연구책임자 (Co-PI)"):"")}${row(T("Period","기간"),f.period?esc(ym(f.period))+(isDone(f)?` · ${T("Completed","종료")}`:` · ${T("Ongoing","진행 중")}`):"")}${row(T("Project No.","과제 번호"),esc(f.no||""))}${row(T("Description","과제 설명"),d?esc(d):""," class=\"pdesc\"")}</dl>`;}
function openProject(i){const t=SITE.projects[i];
      const pimgs=[SITE.projectImgs?.[i],...(SITE.projectMore?.[i]||[])].filter(Boolean);
      openModal(`${pimgs.length?galHTML(pimgs):`<div class="img">${T("Project image (to be replaced)","과제 이미지 (원본으로 교체 예정)")}</div>`}<div class="modal-body"><h3 id="mTitle">${esc(t)}</h3>${projOverview(SITE.projectInfo?.[i]||{})}</div>`);$mc._full=pimgs;admModalTools("projects",i);}
/* 활동 분류: 기본 2개 + 관리자가 만든 분류(각 게시물에 catEn·catKo로 이름 저장) */
const ACT_BASE=[{k:"conf",en:"Scientific Conference Attendances",ko:"학술대회 참석",s:["Conference","학술대회"]},{k:"out",en:"Outreach & Extra Activities",ko:"대외활동 및 연구실 행사",s:["Outreach","대외활동"]}];
let ACT_NEW=[];
function actCats(){const m=new Map(ACT_BASE.map(c=>[c.k,c]));
  [...OLD_POSTS.filter(p=>p.cat&&(p.catEn||p.catKo)).map(p=>({k:p.cat,en:p.catEn||p.catKo,ko:p.catKo||p.catEn})),...ACT_NEW].forEach(c=>{if(!m.has(c.k))m.set(c.k,c);});
  return [...m.values()];}
const actCatO=k=>actCats().find(c=>c.k===k)||{k,en:k||"",ko:k||""};
const actCat=k=>{const c=actCatO(k);return T(c.en,c.ko);};
const actCatShort=k=>{const c=actCatO(k);return c.s?T(...c.s):T(c.en,c.ko);};
function actCatMake(ko,en){ko=String(ko||"").trim();en=String(en||"").trim();if(!ko&&!en)return "";
  const same=actCats().find(c=>admNorm(c.ko)===admNorm(ko||en)||admNorm(c.en)===admNorm(en||ko));if(same)return same.k;
  const k="c"+Date.now().toString(36);ACT_NEW.push({k,en:en||ko,ko:ko||en});return k;}
function openAward(k){const a=AWARDS[k];if(!a)return;openModal(`${galHTML(a.full?.length?a.full:a.imgs,a.caps)}<div class="modal-body"><span class="meta" style="font-size:13px;color:var(--muted)">${a.date.replaceAll("-",". ")}</span><h3 id="mTitle">${esc(a.title)}</h3>${a.text?`<div class="ptext">${esc(a.text)}</div>`:""}</div>`);$mc._full=a.full||a.imgs;$mc._caps=a.caps||[];admModalTools("awards",k);}
function openActivity(id){const p=OLD_POSTS.find(x=>x.id===id);if(!p)return;
  openModal(`${galHTML(p.full?.length?p.full:p.imgs,p.caps)}<div class="modal-body"><span class="meta" style="font-size:13px;color:var(--muted)">${p.date?p.date.replaceAll("-",". ")+" · ":""}${esc(actCat(p.cat))}</span><h3 id="mTitle">${esc(p.title)}</h3>${p.text?`<div class="ptext">${esc(p.text)}</div>`:""}</div>`);$mc._full=p.full||p.imgs;$mc._caps=p.caps||[];admModalTools("posts",OLD_POSTS.indexOf(p));}
/* 스마트폰: 홈 타이틀·부제를 각각 한 줄에 맞춤 (화면 폭에 맞춰 글씨 크기를 줄임) */
function heroFit(){document.querySelectorAll(".hero h1,.hero .ko").forEach(el=>{el.style.fontSize="";
  if(Math.min(innerWidth,screen.width||innerWidth)>560)return;const w=el.clientWidth,sw=el.scrollWidth;if(w&&sw>w){const f=parseFloat(getComputedStyle(el).fontSize);el.style.fontSize=Math.floor(f*w/sw*10)/10+"px";}});
  /* 부제가 제목보다 커 보이지 않게 */const h=document.querySelector(".hero h1"),k=document.querySelector(".hero .ko");
  if(h&&k&&Math.min(innerWidth,screen.width||innerWidth)<=560){const hf=parseFloat(getComputedStyle(h).fontSize);if(parseFloat(getComputedStyle(k).fontSize)>hf)k.style.fontSize=hf+"px";}}
addEventListener("resize",heroFit);addEventListener("load",heroFit);document.fonts?.ready.then(heroFit);
/* 방문자 기록: 페이지를 열 때마다 Worker에 알림 (관리자 로그인 중이거나 내 컴퓨터에서 열면 세지 않음) */
let STAT_REF=document.referrer;
function statHit(id){try{if(!GH_AUTH||id==="admin"||sessionStorage.getItem("hibeGh")||/^(localhost|127\.|\[)/.test(location.hostname)||!navigator.sendBeacon)return;
  navigator.sendBeacon(GH_AUTH+"/hit",JSON.stringify({p:id,r:STAT_REF}));STAT_REF="";}catch(e){}}
function route(){
  let id = location.hash.slice(1);
  if(!views[id]) id = "home";
  if(!$modal.hidden) closeModal();
  $main.innerHTML = views[id]();
  heroFit();
  statHit(id);
  admBar();
  $nav.querySelectorAll("a").forEach(a=>{ if(a.dataset.id===id||(a.dataset.id==="pi"&&id==="members")) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $nav.classList.remove("open"); document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  if(id==="publications"){
    renderPubs();
    if(NEWS_OPEN?.sec==="publications"){const k=NEWS_OPEN.key;NEWS_OPEN=null;openPub(k);}
    const pl=document.getElementById("publist");
    pl.addEventListener("click",e=>{const li=e.target.closest(".pub,.pub-card");if(li)openPub(+li.dataset.k);});
    pl.addEventListener("keydown",e=>{const li=e.target.closest(".pub");if(li&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openPub(+li.dataset.k);}});
    document.getElementById("q").addEventListener("input", renderPubs);
    document.getElementById("seg").addEventListener("change", ()=>renderPubs());
    document.getElementById("sortSeg").addEventListener("click", e=>{const b=e.target.closest("button"); if(!b) return; PUBSORT=b.dataset.s;prefSet("pubsort",PUBSORT);
      document.querySelectorAll("#sortSeg button").forEach(x=>x.setAttribute("aria-pressed", x===b)); renderPubs();});
    document.getElementById("viewSeg").addEventListener("click", e=>{const b=segNext(e); if(!b) return; PUBVIEW=b.dataset.v;prefSet("pubview",PUBVIEW);
      document.querySelectorAll("#viewSeg button").forEach(x=>x.setAttribute("aria-pressed", x===b)); renderPubs();});
  }
  if(id==="projects"){
    document.getElementById("projFilter").onclick=e=>{const b=e.target.closest("button");if(!b||b.dataset.f===PROJFILTER)return;PROJFILTER=b.dataset.f;prefSet("projfilter",PROJFILTER);const y=scrollY;route();window.scrollTo(0,y);};
    if(!pList().length){document.getElementById("carView").hidden=true;document.getElementById("projList").outerHTML=`<p class="empty">${T("No projects here yet.","해당하는 과제가 없습니다.")}</p>`;return;}
    const track=document.getElementById("track"), slides=[...track.children], n=slides.length;
    const cur=()=>{const c=track.scrollLeft+track.clientWidth/2;let best=0,d=1e9;slides.forEach((s,i)=>{const x=Math.abs(s.offsetLeft+s.offsetWidth/2-c);if(x<d){d=x;best=i}});return best};
    const go=(i,instant)=>{const s=slides[Math.max(0,Math.min(n-1,i))];track.scrollTo({left:s.offsetLeft-(track.clientWidth-s.offsetWidth)/2,behavior:instant?"instant":"smooth"});};
    const sync=()=>{const i=cur();document.querySelectorAll("#dots button").forEach((b,j)=>b.setAttribute("aria-current",j===i));
      document.getElementById("prev").disabled=i===0;document.getElementById("next").disabled=i===n-1;document.getElementById("count").textContent=`${i+1} / ${n}`;slides.forEach((s,j)=>s.classList.toggle("on",j===i));};
    document.getElementById("prev").onclick=()=>go(cur()-1);
    document.getElementById("next").onclick=()=>go(cur()+1);
    document.getElementById("dots").onclick=e=>{const b=e.target.closest("button");if(b)go(+b.dataset.i)};
    track.addEventListener("scroll",()=>requestAnimationFrame(sync),{passive:true});
    /* 마우스로 끌어서 넘기기 (터치는 브라우저 기본 스와이프) */
    let down=null, moved=false;
    track.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;down={x:e.clientX,s:track.scrollLeft,i:cur()};moved=false;});
    window.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-down.x;if(Math.abs(dx)>6){moved=true;track.classList.add("dragging");}if(moved)track.scrollLeft=down.s-dx;});
    window.addEventListener("pointerup",e=>{if(!down)return;const dx=e.clientX-down.x,start=down.i;down=null;if(!moved)return;
      track.classList.remove("dragging");go(Math.abs(dx)>60?start+(dx<0?1:-1):start);});
    /* 클릭(또는 탭)하면 과제 정보 */
    const open=openProject;
    if(NEWS_OPEN?.sec==="projects"){const k=NEWS_OPEN.key;NEWS_OPEN=null;open(k);}
    track.addEventListener("click",e=>{if(moved){moved=false;return;}const s=e.target.closest(".slide");if(s)open(+s.dataset.i);});
    track.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();open(cur())}});
    const plist=document.getElementById("projList");
    plist.addEventListener("click",e=>{const r=e.target.closest(".proj-row");if(r)open(+r.dataset.i);});
    plist.addEventListener("keydown",e=>{const r=e.target.closest(".proj-row");if(r&&e.key==="Enter")open(+r.dataset.i);});
    document.querySelector(".proj-tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;PROJVIEW=b.dataset.v;prefSet("projview",PROJVIEW);
      document.querySelectorAll(".proj-tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
      document.getElementById("carView").hidden=PROJVIEW==="list";plist.hidden=PROJVIEW!=="list";if(PROJVIEW!=="list"){go(cur(),true);sync();}});
    requestAnimationFrame(()=>{go(0,true);sync();});
    track.tabIndex=0;
    track.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();go(cur()+1)}if(e.key==="ArrowLeft"){e.preventDefault();go(cur()-1)}});
    sync();
  }
  if(id==="members"){
    const openM=k=>{const m=SITE.members[k];
      openModal(`<div class="modal-body m-detail"><div class="avatar">${m.photo?`<img src="${m.photo}" alt="">`:initials(m.name)}</div><div>
        <h3 id="mTitle">${m.name}</h3><div class="role">${roleHTML(m.role)}</div>
        <div class="ri">${T("Research Interests","연구 주제")}</div><ul>${m.interests.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
        <div class="links"><a href="mailto:${m.email}">${m.email}</a>${m.cv?`<a href="${esc(m.cv)}" data-cv="${esc(m.name)}">CV</a>`:""}</div></div></div>`);};
    const sec=$main.querySelector("section.page");

  }
  if(id==="awards"){
    const grid=document.getElementById("igGrid"),PAGE=16;let shown=0;
    const tile=(a,k)=>`<button type="button" class="ig-tile" data-k="${k}" aria-label="${esc(a.title)}">${a.imgs.length?`<img src="${a.imgs[0]}" alt="" loading="lazy">`:`<span class="ig-noimg">${esc(a.title)}</span>`}${a.imgs.length>1?`<span class="cnt">${a.imgs.length}</span>`:""}<span class="ig-cap"><b>${esc(a.title)}</b><small>${a.date.replaceAll("-",". ")}</small></span></button>`;
    const LIST=AWARDS.map((a,k)=>[a,k]).filter(([a])=>AWYEAR==="all"||(a.date||"").startsWith(AWYEAR));
    document.getElementById("awYears").onchange=e=>{AWYEAR=e.target.value;const y=scrollY;route();window.scrollTo(0,y);};
    const more=()=>{if(shown>=LIST.length)return;const next=LIST.slice(shown,shown+PAGE);grid.insertAdjacentHTML("beforeend",next.map(([a,k])=>tile(a,k)).join(""));shown+=next.length;
      const end=document.getElementById("awEnd");end.hidden=!(shown>=LIST.length&&LIST.length>PAGE);end.textContent=T("You have seen all awards.","모든 수상 내역을 다 봤습니다.");};
    more();
    const awIo=new IntersectionObserver(es=>{if(es[0].isIntersecting)more();},{rootMargin:"400px"});awIo.observe(document.getElementById("awSentinel"));
    const list=grid;
    const openAw=openAward;
    list.addEventListener("click",e=>{const t=e.target.closest(".ig-tile");if(t)openAw(+t.dataset.k);});
    if(NEWS_OPEN?.sec==="awards"){const k=NEWS_OPEN.key;NEWS_OPEN=null;openAw(k);}
  }
  if(id==="activities"){
    const SAMPLE=OLD_POSTS;
    let filter=document.querySelector(`#actSeg button[data-c="${CSS.escape(ACTFILTER)}"]`)?ACTFILTER:"all";
    const all=()=>[...SAMPLE].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const PAGE=16; let shown=PAGE;
    const card=p=>`<article class="post" data-id="${p.id}" tabindex="0" role="button">
        <div class="ph">${p.imgs.length?`<img src="${p.imgs[0]}" alt="" loading="lazy">${p.imgs.length>1?`<span class="cnt">${p.imgs.length}</span>`:""}`:`<div class="fake">${T("Photo","사진")}</div>`}</div>
        <div class="body"><span class="meta">${p.date?p.date.replaceAll("-",". ")+" · ":""}${esc(actCat(p.cat))}</span><h3>${esc(p.title)}</h3>${p.text?`<p>${esc(p.text)}</p>`:""}
</div></article>`;
    const render=(reset)=>{if(reset!==false)shown=PAGE;const list=all().filter(p=>filter==="all"||p.cat===filter);
      document.getElementById("feedEnd").hidden=!(list.length>PAGE&&shown>=list.length);document.getElementById("feedEnd").textContent=T("You have seen all posts.","모든 게시물을 다 봤습니다.");
      document.getElementById("feed").innerHTML=list.slice(0,shown).map(card).join("")||`<div class="empty">${T("No posts in this category yet. Use \"+ New post\" to add one.","이 분류에는 아직 게시물이 없습니다. 오른쪽 위 \"+ 새 게시물\"로 올려 보세요.")}</div>`;};
    const openPost=openActivity;
    if(NEWS_OPEN?.sec==="activities"){const k=NEWS_OPEN.key;NEWS_OPEN=null;openPost(k);}
    document.getElementById("actSeg").addEventListener("click",e=>{const b=segNext(e);if(!b)return;filter=ACTFILTER=b.dataset.c;prefSet("actfilter",ACTFILTER);

    io.observe(document.getElementById("sentinel"));

  }
  if(id==="home"){const feed=document.getElementById("newsFeed"),ALL=newsItems(),PAGE=25;let shown=0;
    const card=(n,x)=>`<button type="button" class="ncard" data-x="${x}" style="${gTone(x)}"><div class="nimg${n.img?(n.fit==="contain"?"":" "+n.fit):" txt"}">${n.img?`<img src="${n.img}" alt="" loading="lazy" data-v="${esc(n.venue||"")}" onerror="imgFail(this)">`:`<span>${esc(n.venue||"")}</span>`}</div>
      <div class="nbody"><span class="nmeta"><b>${T(...n.c)}</b> · ${newsDate(n.d)}</span><span class="nt">${esc(n.t)}</span></div></button>`;
    const more=()=>{if(shown>=ALL.length)return;feed.insertAdjacentHTML("beforeend",ALL.slice(shown,shown+PAGE).map((n,k)=>card(n,shown+k)).join(""));shown=Math.min(ALL.length,shown+PAGE);

  if(id==="admin") admRender();
  if(id==="join"){

      const btn=e.currentTarget;
      navigator.clipboard.writeText("myk127@cau.ac.kr").then(()=>{btn.textContent=T("Copied","복사됨")},()=>{
        const r=document.createRange(); r.selectNodeContents(document.getElementById("mailtxt")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent=T("Selected","선택됨");});
    });
  }

function ghApi(path,init={}){return fetch("https://api.github.com"+path,{cache:"no-store",...init,headers:{Authorization:`Bearer ${GH_TOKEN}`,Accept:"application/vnd.github+json",...(init.body?{"Content-Type":"application/json"}:{}),...(init.headers||{})}});}

function ghPut(path,{message,content,sha}){
  if(!ADMIN?.student)return ghApi(`/repos/${GH_REPO}/contents/${path}`,{method:"PUT",body:JSON.stringify({message,branch:GH_BRANCH,content,...(sha?{sha}:{})})});

async function rolesLoad(){const r=await ghApi(`/repos/${GH_REPO}/contents/content/roles.json?ref=${GH_BRANCH}`);
  if(!r.ok)return {sha:null,data:{students:[]}};const f=await r.json();
  try{const d=JSON.parse(unb64(f.content));return {sha:f.sha,data:{students:Array.isArray(d.students)?d.students:[]}};}catch(e){return {sha:f.sha,data:{students:[]}};}}
const b64=s=>{const u=new TextEncoder().encode(s);let o="";for(let i=0;i<u.length;i+=0x8000)o+=String.fromCharCode(...u.subarray(i,i+0x8000));return btoa(o);};
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
/* 관리자: GitHub에서 바로 최신 내용을 읽음 (사이트 반영 전의 수정도 보이도록) */
async function ghContentLoad(){
  for(const k of ADM_KEYS){const r=await ghApi(`/repos/${GH_REPO}/contents/content/${k}.json?ref=${GH_BRANCH}`);
    if(r.status===404){CONTENT_SHA[k]=null;continue;}if(!r.ok)continue;const f=await r.json();CONTENT_SHA[k]=f.sha;
    try{const d=JSON.parse(unb64(f.content));if(Array.isArray(d))ADM[k].set(d);}catch(e){}}
  scholarRemap();
}

      const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||r.status);A.out=(Array.isArray(d.items)?d.items:[d]).filter(x=>x&&x.section);A.out.forEach(x=>admAutoForce(A,x));if(!A.out.length)throw new Error("자료에서 올릴 내용을 찾지 못했습니다");}
    catch(err){A.msg="초안을 만들지 못했습니다: "+(err.message||err);}
    A.busy=false;if(document.getElementById("admAuto"))admRender();};
  const list=box.querySelector(".adm-drafts");if(!list)return;const O=A.out;
  const rev=box.querySelector("#admRev");if(rev)rev.oninput=e=>{A.rev=e.target.value;};
  const rvGo=box.querySelector("#admRevGo");
  if(rvGo)rvGo.onclick=async()=>{const ins=(A.rev||"").trim(),idx=O.map((d,i)=>i).filter(i=>!O[i].done&&!O[i].skip);
    if(!ins){A.msg="어떻게 고칠지 적어 주세요.";return admRender();}if(!idx.length){A.msg="고칠 초안을 골라 주세요.";return admRender();}
    A.rbusy=true;A.msg="";admRender();
    try{const files=await admAutoFiles(A),drafts=idx.map(i=>({section:O[i].section,reason:O[i].reason||"",fields:O[i].fields||{},images:O[i].images||[]}));
      const r=await fetch(`${GH_AUTH}/draft`,{method:"POST",headers:{Authorization:`Bearer ${GH_TOKEN}`,"Content-Type":"application/json"},
        body:JSON.stringify({files,note:(A.note?A.note+"\n\n":"")+"수정 요청: "+ins,today:new Date().toISOString().slice(0,10),section:A.to||"",pubcat:A.pc||"",drafts})});
      const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||r.status);
      const items=(Array.isArray(d.items)?d.items:[d]).filter(x=>x&&x.section);if(!items.length)throw new Error("고친 초안이 비어 있습니다");items.forEach(x=>admAutoForce(A,x));
      const set=new Set(idx);A.out=items.length===idx.length?O.map((x,i)=>set.has(i)?items[idx.indexOf(i)]:x):[...O.filter((x,i)=>i<idx[0]&&!set.has(i)),...items,...O.filter((x,i)=>i>idx[0]&&!set.has(i))];
      A.rev="";A.msg=`요청대로 초안을 고쳤습니다 (${items.length}건). 내용을 확인해 주세요.`;}
    catch(err){A.msg="초안을 고치지 못했습니다: "+(err.message||err);}
    A.rbusy=false;if(document.getElementById("admAuto"))admRender();};
  const left=()=>{if(O.every(d=>d.done)){A.files=[];A.note="";}};
  list.onchange=e=>{const c=e.target.closest("[data-chk]"),q=e.target.closest("[data-sec]");
    if(c){O[+c.dataset.chk].skip=!c.checked;admRender();}if(q){const d=O[+q.dataset.sec],[sec,pc]=q.value.split(":");d.section=sec;if(pc){d.fields=d.fields||{};d.fields[sec==="posts"?"cat":"pubcat"]=pc;}admRender();}
    const u=e.target.closest("[data-dup]");if(u)O[+u.dataset.dup].dup=u.value;};
  list.onclick=e=>{const b=e.target.closest("[data-open]");if(!b)return;const d=O[+b.dataset.open],sec=d.section;
    const use=new Set((d.images||[]).filter(x=>x.use).map(x=>x.index)),files=A.files.filter((f,i)=>use.has(i)||(O.length===1&&(!(d.images||[]).length||f.type==="application/pdf")));
    const di=d.dup==="new"?-1:admDupIdx(sec,d);d.done=di>=0?"기존 항목을 편집 창에서 열었음":"편집 창에서 열었음";left();ADMTAB=sec;admRender();admEdit(sec,di,{fields:admAutoFields(sec,d.fields),files});};
  const all=box.querySelector("#admAutoAll");
  if(all)all.onclick=async()=>{const todo=O.filter(d=>!d.done&&!d.skip);if(!todo.length){A.msg="저장할 초안을 골라 주세요.";return admRender();}
    all.disabled=true;all.textContent="저장 중…";const by={};todo.forEach(d=>(by[d.section]||(by[d.section]=[])).push(d));
    for(const [sec,ds] of Object.entries(by)){const S=ADM[sec],arr=S.get(),add=[],upd=[];
      for(const d of ds){const di=admDupIdx(sec,d),mode=di<0?"new":(d.dup||"skip");
        if(mode==="skip"){d.done="이미 있는 항목이라 건너뜀";continue;}
        if(mode==="upd"){const it={...arr[di],...admAutoFields(sec,d.fields)};S.prep?.(it);S.fin?.(it);arr[di]=it;upd.push(d);continue;}
        const it={...S.blank(),...admAutoFields(sec,d.fields)};S.prep?.(it);S.fin?.(it);it.added=new Date().toISOString().slice(0,10);add.push([d,it]);}
      if(!add.length&&!upd.length)continue;
      if(await admSave(sec,[...add.map(([,it])=>it).reverse(),...arr])){add.forEach(([d])=>{d.done=`${S.label[1]}에 저장함`;});upd.forEach(d=>{d.done="기존 항목을 업데이트함";});}}
    left();admRender();};
}
async function admAdmins(){
  const body=document.getElementById("admBody");body.innerHTML=`<p>불러오는 중…</p>`;
  const [cr,ir]=await Promise.all([ghApi(`/repos/${GH_REPO}/collaborators?per_page=100`),ADMIN.owner?ghApi(`/repos/${GH_REPO}/invitations`):null]);
  if(!cr.ok){body.innerHTML=`<p class="adm-msg">관리자 명단을 읽지 못했습니다 (${cr.status}).</p>`;return;}
  const list=(await cr.json()).filter(c=>c.permissions?.push),inv=ir?.ok?await ir.json():[];
  body.innerHTML=`<div class="adm-students" style="margin-top:0"><h3>관리자 <small>모든 메뉴 편집 · 저장소 쓰기 권한</small></h3></div>${ADMIN.owner?`<form class="adm-head" id="admAddForm"><input id="admNew" placeholder="추가할 관리자의 GitHub 아이디" required autocomplete="off"><button class="btn-post">관리자 초대</button></form>
    <p class="adm-note">초대받은 분이 GitHub 메일이나 알림에서 초대를 수락하면, 이 페이지에서 'GitHub로 로그인'으로 들어올 수 있습니다. GitHub 계정이 없으면 github.com에서 무료로 만들면 됩니다.</p>`:`<p class="adm-note">관리자 초대·삭제는 저장소 소유자만 할 수 있습니다.</p>`}
    <ul class="adm-list">${list.map(c=>`<li data-u="${esc(c.login)}"><div class="adm-th"><img src="${esc(c.avatar_url)}&s=96" alt=""></div><div class="adm-tx"><b>${esc(c.login)}</b><small>${c.permissions.admin?"소유자":"관리자"}</small></div>
      <div class="adm-act">${c.login===ADMIN.login?"<small>나</small>":ADMIN.owner&&!c.permissions.admin?`<button type="button" class="danger" data-a="rm">삭제</button>`:""}</div></li>`).join("")}
    ${inv.map(v=>`<li data-inv="${v.id}"><div class="adm-th"></div><div class="adm-tx"><b>${esc(v.invitee?.login||"")}</b><small>초대 수락 대기 중</small></div><div class="adm-act"><button type="button" class="danger" data-a="cancel">초대 취소</button></div></li>`).join("")}</ul>`;
  const f=body.querySelector("#admAddForm");
  if(f)f.onsubmit=async e=>{e.preventDefault();const u=body.querySelector("#admNew").value.trim().replace(/^@/,"");if(u.includes("@"))return alert("이메일이 아니라 GitHub 아이디를 넣어 주세요. 아이디는 github.com 오른쪽 위 프로필을 누르면 보입니다.\n\n학생 연구원(게시물만 편집)이라면 아래쪽 학생 연구원 칸에 넣어 주세요.");
    const r=await ghApi(`/repos/${GH_REPO}/collaborators/${encodeURIComponent(u)}`,{method:"PUT",body:JSON.stringify({permission:"push"})});
    if(!r.ok)alert(r.status===404?"그런 GitHub 아이디가 없습니다.":"초대하지 못했습니다: "+((await r.json().catch(()=>({}))).message||r.status));admAdmins();};
  body.querySelector(".adm-list").onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const li=b.closest("li");
    if(b.dataset.a==="rm"){const u=li.dataset.u;if(!confirm(`${u} 을(를) 관리자에서 뺄까요?`))return;
      const r=await ghApi(`/repos/${GH_REPO}/collaborators/${encodeURIComponent(u)}`,{method:"DELETE"});if(!r.ok)alert("삭제하지 못했습니다 ("+r.status+")");}
    if(b.dataset.a==="cancel"){const r=await ghApi(`/repos/${GH_REPO}/invitations/${li.dataset.inv}`,{method:"DELETE"});if(!r.ok)alert("취소하지 못했습니다 ("+r.status+")");}
    admAdmins();};
  admStudents(body);
}
/* 학생 연구원: 저장소 권한 없이, 활동·수상·연구과제·논문만 편집 (명단은 content/roles.json) */
async function admStudents(body){
  const sec=document.createElement("div");sec.className="adm-students";body.appendChild(sec);
  const roles=await rolesLoad(),list=roles.data.students;
  sec.innerHTML=`<h3>학생 연구원 <small>활동·수상·연구과제·논문만 추가·수정·삭제</small></h3>
    <form class="adm-head" id="admStuForm"><input id="admStuId" placeholder="GitHub 아이디 또는 GitHub에 등록된 이메일 (예: name@gmail.com)" required autocomplete="off"><input id="admStuName" placeholder="이름 (선택)" autocomplete="off"><button class="btn-post">학생 추가</button></form>
    <p class="adm-note">학생은 저장소 초대가 필요 없습니다. 여기에 GitHub 아이디나 이메일(구글 계정으로 GitHub에 가입했다면 그 Gmail)을 넣으면 바로 'GitHub로 로그인'으로 들어와 활동·수상·연구과제·논문 메뉴만 편집할 수 있습니다. 위의 관리자는 모든 메뉴를 편집합니다.</p>
    <ul class="adm-list">${list.length?list.map((x,j)=>`<li data-j="${j}"><div class="adm-th">${x.login?`<img src="https://github.com/${encodeURIComponent(x.login)}.png?size=96" alt="">`:""}</div><div class="adm-tx"><b>${esc(x.login||x.email)}</b><small>${esc(x.name||"학생 연구원")}</small></div><div class="adm-act"><button type="button" class="danger" data-s="rm">삭제</button></div></li>`).join(""):`<li><div class="adm-tx"><small>아직 없습니다.</small></div></li>`}</ul>`;
  /* change: 명단을 받아 새 명단을 돌려줌. 그사이 명단이 바뀌었으면(409/422) 최신 명단을 다시 읽어 한 번 더 적용 */
  const save=async(change,what)=>{let cur=roles,r;
    for(let t=0;t<2;t++){r=await ghApi(`/repos/${GH_REPO}/contents/content/roles.json`,{method:"PUT",body:JSON.stringify({message:`관리 화면: 학생 연구원 ${what} (${ADMIN.login})`,branch:GH_BRANCH,content:b64(JSON.stringify({students:change(cur.data.students)},null,1)+"\n"),...(cur.sha?{sha:cur.sha}:{})})});
      if(r.status!==409&&r.status!==422)break;cur=await rolesLoad();}
    if(!r.ok)alert("저장하지 못했습니다: "+((await r.json().catch(()=>({}))).message||r.status));sec.remove();admStudents(body);};
  sec.querySelector("#admStuForm").onsubmit=async e=>{e.preventDefault();const u=sec.querySelector("#admStuId").value.trim().replace(/^@/,""),n=sec.querySelector("#admStuName").value.trim();if(u.includes("@")){const em=u.toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return alert("이메일 주소를 확인해 주세요.");
      if(list.some(x=>String(x.email||"").toLowerCase()===em))return alert("이미 명단에 있습니다.");return save(l=>l.some(x=>String(x.email||"").toLowerCase()===em)?l:[...l,{email:em,name:n}],"추가");}
    const chk=await ghApi(`/users/${encodeURIComponent(u)}`);if(!chk.ok)return alert("그런 GitHub 아이디가 없습니다.");const login=(await chk.json()).login;
    if(list.some(x=>String(x.login||"").toLowerCase()===login.toLowerCase()))return alert("이미 명단에 있습니다.");await save(l=>l.some(x=>String(x.login||"").toLowerCase()===login.toLowerCase())?l:[...l,{login,name:n}],"추가");};
  sec.querySelector(".adm-list").onclick=async e=>{const b=e.target.closest("[data-s]");if(!b)return;const j=+b.closest("li").dataset.j;
    if(!confirm(`${list[j].login||list[j].email} 을(를) 학생 연구원 명단에서 뺄까요?`))return;const rm=list[j];await save(l=>l.filter(x=>!(rm.login?String(x.login||"").toLowerCase()===rm.login.toLowerCase():String(x.email||"").toLowerCase()===String(rm.email||"").toLowerCase())),"삭제");};
}
